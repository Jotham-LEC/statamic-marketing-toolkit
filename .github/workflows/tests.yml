name: Tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} · ${{ matrix.statamic }} · ${{ matrix.db }}${{ !matrix.imagick && ' · no imagick' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest PHP, Statamic and Laravel composer.json allows. (Not
          # --prefer-lowest across the board: Laravel 12.40's lowest Guzzle
          # doesn't load on its own.)
          - { php: '8.3', statamic: '6.30.*', laravel: '^12.40', db: sqlite, imagick: true }
          - { php: '8.4', statamic: latest, db: sqlite, imagick: true }
          - { php: '8.4', statamic: latest, db: pgsql, imagick: true }
          # Favicons drawn with GD; the share-card tests skip.
          - { php: '8.4', statamic: latest, db: sqlite, imagick: false }

    services:
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seo_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, mbstring, openssl, pdo_sqlite, pdo_pgsql, ${{ matrix.imagick && 'imagick' || ':imagick' }}
          coverage: none

      - name: Pin Statamic ${{ matrix.statamic }} and Laravel ${{ matrix.laravel }}
        if: matrix.statamic != 'latest'
        run: composer require --no-update --no-interaction "statamic/cms:${{ matrix.statamic }}" "laravel/framework:${{ matrix.laravel }}"

      - uses: ramsey/composer-install@v3

      # One Postgres database, so that run is serial.
      - name: Tests
        run: vendor/bin/pest ${{ matrix.db == 'sqlite' && '--parallel' || '' }}
        env:
          SEO_TEST_DB: ${{ matrix.db == 'pgsql' && 'pgsql' || '' }}
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  quality:
    name: Pint, PHPStan, built assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, gd, imagick, mbstring, openssl
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer lint
      - run: composer analyse

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The committed build must be what the source builds to.
      - run: npm ci && npm run build
      - run: git diff --exit-code resources/dist && test -z "$(git status --porcelain resources/dist)"
