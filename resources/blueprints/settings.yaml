tabs:
  checks:
    display: 'seo::fields.settings.tabs.checks'
    sections:
      -
        display: 'seo::fields.settings.sections.checks.display'
        instructions: 'seo::fields.settings.sections.checks.instructions'
        fields:
          -
            handle: rule_title_length
            field: { type: toggle, display: 'seo::fields.settings.rule_title_length.display', default: true, width: 33 }
          -
            handle: rule_title_unique
            field: { type: toggle, display: 'seo::fields.settings.rule_title_unique.display', default: true, width: 33 }
          -
            handle: rule_description_length
            field: { type: toggle, display: 'seo::fields.settings.rule_description_length.display', default: true, width: 33 }
          -
            handle: rule_description_unique
            field: { type: toggle, display: 'seo::fields.settings.rule_description_unique.display', default: true, width: 33 }
          -
            handle: rule_single_h1
            field: { type: toggle, display: 'seo::fields.settings.rule_single_h1.display', default: true, width: 33 }
          -
            handle: rule_canonical
            field: { type: toggle, display: 'seo::fields.settings.rule_canonical.display', default: true, width: 33 }
          -
            handle: rule_noindex_in_sitemap
            field: { type: toggle, display: 'seo::fields.settings.rule_noindex_in_sitemap.display', default: true, width: 33 }
          -
            handle: rule_image_alt
            field: { type: toggle, display: 'seo::fields.settings.rule_image_alt.display', default: true, width: 33 }
          -
            handle: rule_broken_links
            field: { type: toggle, display: 'seo::fields.settings.rule_broken_links.display', default: true, width: 33 }
          -
            handle: rule_orphan_pages
            field: { type: toggle, display: 'seo::fields.settings.rule_orphan_pages.display', default: true, width: 33 }
          -
            handle: rule_external_links
            field: { type: toggle, display: 'seo::fields.settings.rule_external_links.display', instructions: 'seo::fields.settings.rule_external_links.instructions', default: false, width: 33 }
          -
            handle: rule_og_image
            field: { type: toggle, display: 'seo::fields.settings.rule_og_image.display', default: true, width: 33 }
          -
            handle: rule_json_ld
            field: { type: toggle, display: 'seo::fields.settings.rule_json_ld.display', default: true, width: 33 }
      -
        display: 'seo::fields.settings.sections.lengths.display'
        instructions: 'seo::fields.settings.sections.lengths.instructions'
        fields:
          -
            handle: title_min
            field: { type: integer, display: 'seo::fields.settings.title_min.display', default: 30, width: 25, validate: ['required', 'integer', 'min:1'] }
          -
            handle: title_max
            field: { type: integer, display: 'seo::fields.settings.title_max.display', default: 60, width: 25, validate: ['required', 'integer', 'gt:title_min'] }
          -
            handle: description_min
            field: { type: integer, display: 'seo::fields.settings.description_min.display', default: 50, width: 25, validate: ['required', 'integer', 'min:1'] }
          -
            handle: description_max
            field: { type: integer, display: 'seo::fields.settings.description_max.display', default: 160, width: 25, validate: ['required', 'integer', 'gt:description_min'] }
  running:
    display: 'seo::fields.settings.tabs.running'
    sections:
      -
        display: 'seo::fields.settings.sections.pages.display'
        fields:
          -
            handle: excluded_collections
            field:
              type: collections
              display: 'seo::fields.settings.excluded_collections.display'
              mode: select
          -
            handle: max_pages
            field: { type: integer, display: 'seo::fields.settings.max_pages.display', instructions: 'seo::fields.settings.max_pages.instructions', default: 0, width: 50, validate: ['required', 'integer', 'min:0'] }
      -
        display: 'seo::fields.settings.sections.how.display'
        fields:
          -
            handle: chunk_size
            field: { type: integer, display: 'seo::fields.settings.chunk_size.display', instructions: 'seo::fields.settings.chunk_size.instructions', default: 25, width: 50, validate: ['required', 'integer', 'min:1', 'max:500'] }
          -
            handle: keep_reports
            field: { type: integer, display: 'seo::fields.settings.keep_reports.display', default: 10, width: 50, validate: ['required', 'integer', 'min:1'] }
          # Set on Tools → SEO → Search Console. Hidden here, and still submitted,
          # so saving these settings keeps them.
          -
            handle: search_console_property
            field: { type: text, visibility: hidden }
          -
            handle: search_console_properties
            field: { type: array, mode: dynamic, visibility: hidden }
      -
        display: 'seo::fields.settings.sections.schedule.display'
        instructions: 'seo::fields.settings.sections.schedule.instructions'
        fields:
          -
            handle: schedule
            field:
              type: button_group
              display: 'seo::fields.settings.schedule.display'
              default: 'off'
              options: { 'off': 'seo::fields.settings.schedule.options.off', daily: 'seo::fields.settings.schedule.options.daily', weekly: 'seo::fields.settings.schedule.options.weekly' }
          -
            handle: schedule_day
            field:
              type: select
              display: 'seo::fields.settings.schedule_day.display'
              default: monday
              width: 50
              options: { monday: 'seo::fields.settings.schedule_day.options.monday', tuesday: 'seo::fields.settings.schedule_day.options.tuesday', wednesday: 'seo::fields.settings.schedule_day.options.wednesday', thursday: 'seo::fields.settings.schedule_day.options.thursday', friday: 'seo::fields.settings.schedule_day.options.friday', saturday: 'seo::fields.settings.schedule_day.options.saturday', sunday: 'seo::fields.settings.schedule_day.options.sunday' }
              if: { schedule: 'equals weekly' }
          -
            handle: schedule_time
            field:
              type: time
              display: 'seo::fields.settings.schedule_time.display'
              default: '03:00'
              width: 50
              unless: { schedule: 'equals off' }
