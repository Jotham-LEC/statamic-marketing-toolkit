tabs:
  checks:
    display: Checks
    sections:
      -
        display: 'What a report checks'
        instructions: 'Turn off a check to leave it out of the reports and the scores.'
        fields:
          -
            handle: rule_title_length
            field: { type: toggle, display: 'Title length', default: true, width: 33 }
          -
            handle: rule_title_unique
            field: { type: toggle, display: 'Unique titles', default: true, width: 33 }
          -
            handle: rule_description_length
            field: { type: toggle, display: 'Description length', default: true, width: 33 }
          -
            handle: rule_description_unique
            field: { type: toggle, display: 'Unique descriptions', default: true, width: 33 }
          -
            handle: rule_single_h1
            field: { type: toggle, display: 'One main heading (h1)', default: true, width: 33 }
          -
            handle: rule_canonical
            field: { type: toggle, display: 'Canonical address', default: true, width: 33 }
          -
            handle: rule_noindex_in_sitemap
            field: { type: toggle, display: 'Hidden pages left in the sitemap', default: true, width: 33 }
          -
            handle: rule_image_alt
            field: { type: toggle, display: 'Image descriptions (alt)', default: true, width: 33 }
          -
            handle: rule_broken_links
            field: { type: toggle, display: 'Broken links to this site', default: true, width: 33 }
          -
            handle: rule_orphan_pages
            field: { type: toggle, display: 'Pages no other page links to', default: true, width: 33 }
          -
            handle: rule_external_links
            field: { type: toggle, display: 'Broken links to other sites', instructions: 'Asks each linked site; off by default.', default: false, width: 33 }
          -
            handle: rule_og_image
            field: { type: toggle, display: 'Share image', default: true, width: 33 }
          -
            handle: rule_json_ld
            field: { type: toggle, display: 'Structured data (JSON-LD)', default: true, width: 33 }
      -
        display: 'Lengths'
        instructions: 'Also used by the counters in the search and share preview.'
        fields:
          -
            handle: title_min
            field: { type: integer, display: 'Title: at least', default: 30, width: 25, validate: ['required', 'integer', 'min:1'] }
          -
            handle: title_max
            field: { type: integer, display: 'Title: at most', default: 60, width: 25, validate: ['required', 'integer', 'gt:title_min'] }
          -
            handle: description_min
            field: { type: integer, display: 'Description: at least', default: 50, width: 25, validate: ['required', 'integer', 'min:1'] }
          -
            handle: description_max
            field: { type: integer, display: 'Description: at most', default: 160, width: 25, validate: ['required', 'integer', 'gt:description_min'] }
  running:
    display: Running
    sections:
      -
        display: 'Which pages'
        fields:
          -
            handle: excluded_collections
            field:
              type: collections
              display: 'Leave out these collections'
              mode: select
          -
            handle: max_pages
            field: { type: integer, display: 'Most pages per report', instructions: '0 checks every page.', default: 0, width: 50, validate: ['required', 'integer', 'min:0'] }
      -
        display: 'How'
        fields:
          -
            handle: chunk_size
            field: { type: integer, display: 'Pages per step', instructions: 'How many pages one step renders. Lower it if a step times out.', default: 25, width: 50, validate: ['required', 'integer', 'min:1', 'max:500'] }
          -
            handle: keep_reports
            field: { type: integer, display: 'Reports to keep', default: 10, width: 50, validate: ['required', 'integer', 'min:1'] }
      -
        display: 'Schedule'
        instructions: 'Needs the Laravel scheduler (`php artisan schedule:run` every minute).'
        fields:
          -
            handle: schedule
            field:
              type: button_group
              display: 'Run a report'
              default: 'off'
              options: { 'off': 'Only by hand', daily: 'Daily', weekly: 'Weekly' }
          -
            handle: schedule_day
            field:
              type: select
              display: 'On'
              default: monday
              width: 50
              options: { monday: Monday, tuesday: Tuesday, wednesday: Wednesday, thursday: Thursday, friday: Friday, saturday: Saturday, sunday: Sunday }
              if: { schedule: 'equals weekly' }
          -
            handle: schedule_time
            field:
              type: time
              display: 'At'
              default: '03:00'
              width: 50
              unless: { schedule: 'equals off' }
